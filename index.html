<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><meta name="description" content="RADAR — memoria personal que escucha, entiende y detecta señales.">
<title>RADAR v0.9.1</title><link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#171717;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.45}main{width:min(680px,100%);margin:auto;padding:24px 18px 40px}header{text-align:center;margin-bottom:24px}h1{font-size:34px;letter-spacing:3px;margin:0 0 2px}header small{font-size:14px;color:#666}label{display:block;font-size:18px;font-weight:600;margin-bottom:9px}textarea{width:100%;min-height:150px;padding:15px;border:1px solid #c9ccd1;border-radius:14px;background:white;font:inherit;resize:vertical;outline:none}textarea:focus{border-color:#555;box-shadow:0 0 0 3px #00000010}#detect{display:block;width:100%;min-height:52px;margin:14px 0 22px;border:0;border-radius:14px;background:#111;color:#fff;font-size:16px;font-weight:700;letter-spacing:.5px;cursor:pointer}.card{background:#fff;border:1px solid #e0e2e5;border-radius:16px;padding:18px;margin-top:14px}.card h2{font-size:19px;margin:0 0 12px}.signals{list-style:none;padding:0;margin:0;display:grid;gap:8px}.signals li{padding:10px 12px;border-radius:10px;background:#f3f4f6}.response{margin-top:15px}.feedback-title{font-weight:700;margin:18px 0 9px}.feedback{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.feedback button,.secondary button{min-height:42px;border:1px solid #c9ccd1;background:#fff;border-radius:10px;padding:8px;font:inherit;cursor:pointer}.feedback button:hover,.secondary button:hover{background:#f0f1f3}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid #ddd}.nav button{border:0;background:transparent;font:inherit;font-weight:600;padding:10px;cursor:pointer}.secondary{margin-top:8px}.entry{padding:14px 0;border-bottom:1px solid #e2e2e2}.entry:last-child{border-bottom:0}.entry time{font-size:13px;color:#666}.muted{color:#666}.summary-list{margin:8px 0;padding-left:22px}.summary-list li{margin:5px 0}.status{font-size:14px;color:#555;margin-top:8px}.hidden{display:none}@media(max-width:520px){main{padding:20px 14px 34px}h1{font-size:30px}textarea{min-height:135px}.feedback{grid-template-columns:1fr 1fr}.feedback button:last-child{grid-column:1/-1}.nav{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header><h1>RADAR</h1><small>v0.9.1</small></header>
<label for="input">¿Qué quieres contarme?</label>
<textarea id="input" placeholder="Escribe como hablas normalmente…"></textarea>
<button id="detect">DETECTAR SEÑALES</button>
<section id="result"></section>
<div class="nav"><button id="memoryBtn">📖 Ver memoria</button><button id="summaryBtn">🌅 Resumen del día</button></div>
<section id="secondary"></section>
</main>
<script>
'use strict';
const KEY='radar_memory_v09';
let state=loadMemory();
let current=null;
const $=id=>document.getElementById(id);
function loadMemory(){try{const raw=localStorage.getItem(KEY);const data=raw?JSON.parse(raw):[];return Array.isArray(data)?data:[]}catch(e){return []}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
const days=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function nextWeekday(day){const now=new Date(),delta=(day-now.getDay()+7)%7||7;const d=new Date(now);d.setDate(now.getDate()+delta);return d}
function parseTime(s,d){let m=s.match(/(?:a las|a la)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm|de la mañana|de la tarde|de la noche)?/i)||s.match(/\b(\d{1,2}):(\d{2})\s*(am|pm)?\b/i);if(!m)return d;let h=+m[1],min=+(m[2]||0),p=(m[3]||'').toLowerCase();if((p==='pm'||p.includes('tarde')||p.includes('noche'))&&h<12)h+=12;if((p==='am'||p.includes('mañana'))&&h===12)h=0;d.setHours(h,min,0,0);return d}
function dateInfo(text){const s=text.toLowerCase();let d=null;const now=new Date();
if(/\bhoy\b/.test(s))d=new Date(now);else if(/\bpasado mañana\b/.test(s)){d=new Date(now);d.setDate(d.getDate()+2)}else if(/\bmañana\b/.test(s)){d=new Date(now);d.setDate(d.getDate()+1)}
else{const m=s.match(/\b(lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\b/);if(m){const n=days.indexOf(m[1].replace('miercoles','miércoles').replace('sabado','sábado'));d=nextWeekday(n)}}
const rel=s.match(/(?:dentro de|en)\s+(\d+)\s*(segundos?|minutos?|horas?)/);if(rel){const n=+rel[1],u=rel[2];return new Date(now.getTime()+(u.startsWith('seg')?n*1000:u.startsWith('min')?n*60000:n*3600000))}
if(d){return parseTime(s,d)}return null}
function fmt(d){return d.toLocaleString('es-GT',{dateStyle:'medium',timeStyle:'short'})}
function analyze(text){const s=text.toLowerCase(),a=[];const add=(type,label)=>a.push({type,label});
if(/me siento|estoy (muy )?(triste|feliz|emocionado|emocionada|preocupado|preocupada|estresado|estresada|enojado|enojada|orgulloso|orgullosa|ansioso|ansiosa|tranquilo|tranquila|motivado|motivada)|me da miedo|tengo miedo/.test(s))add('emotion','❤️ Emoción');
if(/me preocupa|me da miedo|tengo miedo|me estresa|estoy preocupado|estoy preocupada/.test(s))add('concern','🚧 Preocupación');
if(/quiero|quisiera|me gustaría|me gustaria|estoy pensando|estoy considerando|si pudiera|tal vez/.test(s))add('intention','🎯 Intención / deseo');
if(/debo|tengo que|hay que|toca|voy a/.test(s))add('commitment','🎯 Compromiso');
if(/recuérdame|recuerdame|recuérdame|no quiero olvidar|no olvidar|debo recordar|tengo que recordar/.test(s))add('reminder','🔔 Recordatorio');
if(/comprar|compra|pagar|pago|gastar|cuesta|presupuesto|\bq\s?\d+|\b\d+\s?(quetzales|quetzal|q)/.test(s))add('money','💰 Dinero / posible gasto');
if(/cómo puedo|como puedo|cómo hago|como hago|no sé cómo|no se como|qué hago|que hago/.test(s))add('question','❓ Pregunta / ayuda');
if(/ya hice|ya terminé|ya termine|logré|logre|conseguí|consegui|terminé|termine|lo hice/.test(s))add('achievement','🏆 Logro / acción realizada');
if(/idea|se me ocurrió|se me ocurrio|pensé en|pense en/.test(s))add('idea','💡 Idea');
const dt=dateInfo(text);if(dt)add('date','📅 '+fmt(dt));
const explicitReminder=a.some(x=>x.type==='reminder')||(a.some(x=>x.type==='commitment')&&!!dt);
return{a,dt,explicitReminder}}
function response(r){const types=r.a.map(x=>x.type);if(types.includes('emotion')){if(types.includes('achievement'))return'🎉 Bien hecho. Reconocer lo que logras también forma parte de avanzar.';if(types.includes('concern'))return'💡 Parece que esto te preocupa. Puede ser útil observar qué parte concreta del problema está bajo tu control.';if(types.includes('intention'))return'🌟 Hay algo que te importa y te está generando emoción. Vale la pena observar qué quieres hacer con eso.';return'🌟 Detecté una emoción. Guardarla permite que RADAR observe con el tiempo qué cosas la provocan.'}if(types.includes('achievement'))return'🎉 Bien hecho. Has avanzado en algo que era importante para ti.';if(types.includes('concern'))return'💡 Detecté una preocupación. La guardaré para poder relacionarla con lo que cuentes después.';if(types.includes('intention'))return'🎯 Hay una intención clara. RADAR la guardará para observar si después aparece una acción relacionada.';if(types.includes('question'))return'🧭 Hay una pregunta o necesidad de ayuda. RADAR la guardará como contexto.';return'📡 Lo guardaré como parte de tu contexto.'}
function render(r){let html='<div class="card"><h2>📡 Detecté:</h2><ul class="signals">'+r.a.map(x=>'<li>'+x.label+'</li>').join('')+'</ul>';if(r.explicitReminder){html+='<p class="status">✓ Recordatorio detectado'+(r.dt?' para <strong>'+fmt(r.dt)+'</strong>':'')+'.';if(r.dt&&r.dt>new Date()){if('Notification'in window&&Notification.permission==='granted')scheduleReminder(current.id,r.dt,current.text);else if('Notification'in window&&Notification.permission==='default')requestNotification();}html+='</p>'}html+='<div class="response"><strong>💬 Respuesta de RADAR</strong><p>'+response(r)+'</p></div><div class="feedback-title">¿Qué tan útil fue?</div><div class="feedback">'+['Superútil','Bastante útil','Regular','Poco útil','Nada útil'].map(x=>'<button data-feedback="'+x+'">'+x+'</button>').join('')+'</div></div>';$('result').innerHTML=html;$('result').querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>feedback(b.dataset.feedback))}
function requestNotification(){if('Notification'in window)Notification.requestPermission().then(p=>{if(p==='granted'&&current?.date){const d=new Date(current.date);if(d>new Date())scheduleReminder(current.id,d,current.text)}}).catch(()=>{})}
function scheduleReminder(id,date,text){const ms=date-new Date();if(ms<=0||ms>2147483647)return;setTimeout(()=>new Notification('RADAR',{body:text}),ms)}
function feedback(f){if(!current)return;current.feedback=f;save();const p=document.createElement('p');p.className='status';p.textContent='✓ Feedback guardado.';$('result').querySelector('.card').appendChild(p)}
$('detect').onclick=()=>{const t=$('input').value.trim();if(!t)return;const r=analyze(t);current={id:Date.now(),text:t,at:new Date().toISOString(),analysis:r.a,date:r.dt?r.dt.toISOString():null,reminder:r.explicitReminder};state.push(current);save();render(r);$('input').value='';if(r.explicitReminder&&'Notification'in window&&Notification.permission==='default')requestNotification()};
$('memoryBtn').onclick=()=>{const s=state.slice().reverse();$('secondary').innerHTML='<div class="card"><h2>🧠 Memoria</h2>'+ (s.length?s.map(x=>'<article class="entry"><time>'+new Date(x.at).toLocaleString('es-GT')+'</time><p>'+escapeHtml(x.text)+'</p><small>'+x.analysis.map(a=>a.label).join(' · ')+(x.feedback?' · Feedback: '+x.feedback:'')+'</small></article>').join(''):'<p class="muted">Aún no hay nada guardado.</p>')+'</div>'};
$('summaryBtn').onclick=()=>{const today=new Date().toDateString(),xs=state.filter(x=>new Date(x.at).toDateString()===today),counts={};xs.flatMap(x=>x.analysis||[]).forEach(a=>counts[a.type]=(counts[a.type]||0)+1);const labels={emotion:'Emociones',concern:'Preocupaciones',intention:'Intenciones',commitment:'Compromisos',reminder:'Recordatorios',money:'Dinero / posibles gastos',question:'Preguntas / ayuda',achievement:'Logros',idea:'Ideas',date:'Fechas'};let h='<div class="card"><h2>🌅 Resumen del día</h2><p>Registré <strong>'+xs.length+'</strong> '+(xs.length===1?'momento':'momentos')+' hoy.</p>';if(xs.length){h+='<ul class="summary-list">'+Object.entries(counts).map(([k,v])=>'<li>'+ (labels[k]||k)+': '+v+'</li>').join('')+'</ul><h3>Momentos de hoy</h3>'+xs.map(x=>'<p>• '+escapeHtml(x.text)+'</p>').join('')}else h+='<p class="muted">Aún no hay entradas de hoy.</p>';h+='</div>';$('secondary').innerHTML=h};
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
