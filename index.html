<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>RADAR v0.9</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f7fb;color:#111827}main{max-width:620px;margin:auto;padding:24px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:800}.ver{font-size:12px;color:#6b7280}textarea{width:100%;box-sizing:border-box;min-height:145px;margin-top:28px;padding:16px;border:1px solid #d1d5db;border-radius:16px;font-size:17px;resize:vertical;background:#fff}button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer}.detect{width:100%;margin-top:12px;background:#111827;color:white;font-size:16px}.result,.panel{background:white;border-radius:16px;padding:16px;margin-top:18px;box-shadow:0 2px 12px #0000000a}.muted{color:#6b7280}.feedback{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.feedback button{font-size:12px;background:#f3f4f6}.nav{margin-top:22px;display:flex;gap:7px}.secondary{background:white;border:1px solid #d1d5db}.hidden{display:none}.item{padding:11px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.signal{margin:9px 0}.why{font-size:13px;color:#4b5563;margin-top:10px}.response{margin-top:14px;padding:12px;border-radius:12px;background:#f8fafc}.tag{display:inline-block;font-size:12px;background:#eef2ff;border-radius:999px;padding:4px 8px;margin:3px 3px 0 0}.panel h3{margin-top:0}.empty{padding:8px 0}.reminder{padding:10px 0;border-bottom:1px solid #eee}.reminder:last-child{border-bottom:0}.small{font-size:13px}
</style></head>
<body><main>
<div class="top"><div class="brand">RADAR</div><div class="ver">v0.9</div></div>
<textarea id="input" placeholder="¿Qué quieres contarme?"></textarea>
<button class="detect" id="detect">DETECTAR SEÑALES</button>
<div id="result"></div>
<div class="nav"><button class="secondary" id="memoryBtn">Memoria</button><button class="secondary" id="summaryBtn">Resumen</button></div>
<section id="memory" class="panel hidden"></section><section id="summary" class="panel hidden"></section>
</main><script src="app.js"></script></body></html>
