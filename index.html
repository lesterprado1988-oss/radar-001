<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>RADAR — Segundo cerebro personal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#171717;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.5}main{width:min(700px,100%);margin:auto;padding:24px 18px 44px}header{text-align:center;margin-bottom:24px}h1{font-size:36px;letter-spacing:4px;margin:0}header small{font-size:13px;color:#666}.intro{color:#555;text-align:center;margin:5px auto 24px;max-width:600px}label{display:block;font-size:18px;font-weight:700;margin-bottom:9px}textarea{width:100%;min-height:155px;padding:16px;border:1px solid #c9ccd1;border-radius:15px;background:#fff;font:inherit;resize:vertical;outline:none}#detect{display:block;width:100%;min-height:54px;margin:14px 0 20px;border:0;border-radius:14px;background:#111;color:#fff;font-size:16px;font-weight:750;cursor:pointer}.card{background:#fff;border:1px solid #e0e2e5;border-radius:16px;padding:18px;margin-top:14px}.card h2{font-size:19px;margin:0 0 12px}.signals{list-style:none;padding:0;margin:0;display:grid;gap:8px}.signals li,.pattern{padding:11px 12px;border-radius:10px;background:#f3f4f6}.response{margin-top:18px;border-top:1px solid #eee;padding-top:15px}.response p{white-space:pre-line}.why{margin-top:12px;padding:12px;border-radius:11px;background:#fafafa;color:#555;font-size:14px}.feedback-title{font-weight:700;margin:18px 0 9px}.feedback{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.feedback button,.nav button{min-height:44px;border:1px solid #c9ccd1;background:#fff;border-radius:10px;padding:8px;font:inherit;cursor:pointer}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid #ddd}.nav button{border:0;background:transparent;font-weight:700}.entry{padding:14px 0;border-bottom:1px solid #e2e2e2}.entry time{font-size:13px;color:#666}.muted,.status{color:#666}.summary-list{margin:8px 0;padding-left:22px}.pattern{margin:8px 0}.pattern strong{display:block}.error{background:#fff1f1;border:1px solid #e0aaaa;color:#8a2020;padding:12px;border-radius:10px;margin-top:12px}.hidden{display:none}@media(max-width:520px){main{padding:20px 14px 34px}h1{font-size:31px}.feedback{grid-template-columns:1fr 1fr}.feedback button:last-child{grid-column:1/-1}.nav{grid-template-columns:1fr}}
</style></head><body><main>
<header><h1>RADAR</h1><small>Segundo cerebro personal · Experimento #001 · v0.10.1</small></header>
<p class="intro">Tú hablas. RADAR recuerda, conecta lo que vas viviendo, aprende de tus respuestas y te ayuda a anticipar.</p>
<label for="input">¿Qué quieres contarme?</label><textarea id="input" placeholder="Escribe como hablas normalmente…"></textarea><button id="detect" type="button">DETECTAR SEÑALES</button>
<section id="result"></section><div class="nav"><button id="memoryBtn" type="button">📖 Ver memoria</button><button id="summaryBtn" type="button">🌅 Resumen del día</button></div><section id="secondary"></section>
</main>
<script>
'use strict';
(function(){
const KEYS=['radar_memory_v09','radar_memory_v010','radar_memory','radar_entries','radarData'];
let state=[],current=null;
const $=id=>document.getElementById(id);
function normalize(raw){
  if(!raw)return [];
  let d=raw; try{if(typeof raw==='string')d=JSON.parse(raw)}catch(e){return []}
  if(Array.isArray(d)) return d.filter(x=>x&&typeof x==='object').map(x=>({id:x.id||Date.now()+Math.random(),text:String(x.text||x.content||x.message||''),at:x.at||x.date||new Date().toISOString(),analysis:Array.isArray(x.analysis)?x.analysis:[],feedback:x.feedback||null,date:x.date||null,reminder:!!x.reminder})).filter(x=>x.text);
  if(d && Array.isArray(d.entries)) return normalize(d.entries);
  if(d && Array.isArray(d.memory)) return normalize(d.memory);
  return [];
}
function load(){
  let merged=[]; const seen=new Set();
  KEYS.forEach(k=>{try{const a=normalize(localStorage.getItem(k));a.forEach(x=>{const key=(x.id||'')+'|'+x.text+'|'+x.at;if(!seen.has(key)){seen.add(key);merged.push(x)}})}catch(e){}});
  return merged.sort((a,b)=>new Date(a.at)-new Date(b.at));
}
function save(){localStorage.setItem('radar_memory_v09',JSON.stringify(state));}
function escape(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
const days=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const emotions={triste:'tristeza',tristeza:'tristeza',feliz:'alegría',emocionado:'entusiasmo',emocionada:'entusiasmo',preocupado:'preocupación',preocupada:'preocupación',estresado:'estrés',estresada:'estrés',enojado:'enojo',enojada:'enojo',orgulloso:'orgullo',orgullosa:'orgullo',ansioso:'ansiedad',ansiosa:'ansiedad',tranquilo:'tranquilidad',tranquila:'tranquilidad',motivado:'motivación',motivada:'motivación'};
function dateInfo(text){const s=text.toLowerCase(),now=new Date();let d=null;if(/\bhoy\b/.test(s))d=new Date(now);else if(/\bpasado mañana\b/.test(s)){d=new Date(now);d.setDate(d.getDate()+2)}else if(/\bmañana\b/.test(s)){d=new Date(now);d.setDate(d.getDate()+1)}else{const m=s.match(/\b(lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\b/);if(m){const day=m[1].replace('miercoles','miércoles').replace('sabado','sábado');const delta=(days.indexOf(day)-now.getDay()+7)%7||7;d=new Date(now);d.setDate(now.getDate()+delta)}}const rel=s.match(/(?:dentro de|en)\s+(\d+)\s*(segundos?|minutos?|horas?)/);if(rel){const n=+rel[1],u=rel[2];return new Date(now.getTime()+(u.startsWith('seg')?n*1000:u.startsWith('min')?n*60000:n*3600000))}if(!d)return null;const tm=s.match(/(?:a las|a la)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm|de la mañana|de la tarde|de la noche)?/i);if(tm){let h=+tm[1],mi=+(tm[2]||0),p=(tm[3]||'').toLowerCase();if((p==='pm'||p.includes('tarde')||p.includes('noche'))&&h<12)h+=12;if((p==='am'||p.includes('mañana'))&&h===12)h=0;d.setHours(h,mi,0,0)}return d}
function fmt(d){return new Date(d).toLocaleString('es-GT',{dateStyle:'medium',timeStyle:'short'})}
function analyze(text){const s=text.toLowerCase(),a=[];const add=(type,label,value)=>a.push({type,label,value:value||null});const em=Object.keys(emotions).find(k=>new RegExp('\\b'+k+'\\b').test(s));
if(/me siento|estoy (muy )?(triste|feliz|emocionado|emocionada|preocupado|preocupada|estresado|estresada|enojado|enojada|orgulloso|orgullosa|ansioso|ansiosa|tranquilo|tranquila|motivado|motivada)|me da miedo|tengo miedo/.test(s))add('emotion','❤️ Emoción',em?emotions[em]:'emoción');
if(/me preocupa|me da miedo|tengo miedo|me estresa|estoy preocupado|estoy preocupada/.test(s))add('concern','🚧 Preocupación');
if(/quiero|quisiera|me gustaría|me gustaria|estoy pensando|estoy considerando|si pudiera|tal vez/.test(s))add('intention','🎯 Intención / deseo');
if(/debo|tengo que|hay que|toca|voy a/.test(s))add('commitment','🎯 Compromiso');
if(/recuérdame|recuerdame|no quiero olvidar|no olvidar|debo recordar|tengo que recordar/.test(s))add('reminder','🔔 Recordatorio');
const money=s.match(/(?:q\s?\.?\s?)(\d+(?:[.,]\d+)?)/i)||s.match(/(\d+(?:[.,]\d+)?)\s?(?:quetzales|quetzal)\b/i);if(/comprar|compra|pagar|pago|gastar|cuesta|presupuesto|dinero|deuda|endeud/.test(s)||money)add('money','💰 Dinero / posible gasto',money?money[1]:null);
if(/cómo puedo|como puedo|cómo hago|como hago|no sé cómo|no se como|qué hago|que hago/.test(s))add('question','❓ Pregunta / ayuda');
if(/ya hice|ya terminé|ya termine|logré|logre|conseguí|consegui|terminé|termine|lo hice/.test(s))add('achievement','🏆 Logro / acción realizada');
if(/idea|se me ocurrió|se me ocurrio|pensé en|pense en/.test(s))add('idea','💡 Idea');
const dt=dateInfo(text);if(dt)add('date','📅 '+fmt(dt),dt.toISOString());
if(!a.length)add('context','🧠 Contexto');return {a,dt,explicitReminder:a.some(x=>x.type==='reminder')||(a.some(x=>x.type==='commitment')&&!!dt)}}
function topicHints(){const words=['dinero','deuda','trabajo','negocio','familia','hijos','salud','casa','estudio','tiempo','emprender','comprar'];return words.map(w=>({w,n:state.filter(x=>x.text.toLowerCase().includes(w)).length})).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,5)}
function emotionCount(v){return state.filter(x=>(x.analysis||[]).some(a=>a.type==='emotion'&&a.value===v)).length}
function patterns(){const out=[],ec={};state.forEach(x=>(x.analysis||[]).forEach(a=>{if(a.type==='emotion')ec[a.value]=(ec[a.value]||0)+1}));Object.entries(ec).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([e,n])=>out.push({title:'Emoción repetida',text:'Has mencionado '+e+' en '+n+' momentos. RADAR está observando qué situaciones aparecen alrededor de ella.'}));topicHints().slice(0,3).forEach(x=>out.push({title:'Tema recurrente',text:'Has hablado de “'+x.w+'” '+x.n+' veces. RADAR puede usar este contexto para futuras sugerencias.'}));return out.slice(0,6)}
function response(r){const t=r.a.map(x=>x.type),lines=[],em=r.a.find(x=>x.type==='emotion')?.value;if(t.includes('emotion')){const n=em?emotionCount(em):0;lines.push(n>=2?'Esta emoción ya apareció antes. En lugar de tratarla como un dato aislado, voy a relacionarla con lo que estaba ocurriendo en esos momentos.':'Voy a guardarla como parte de tu contexto y observar si vuelve a aparecer y con qué situaciones se relaciona.')}if(t.includes('concern'))lines.push(topicHints().length?'También hay temas que se repiten en tu memoria: '+topicHints().slice(0,2).map(x=>'“'+x.w+'”').join(' y ')+'. Si la preocupación vuelve ligada a ellos, te señalaré la conexión.':'Todavía no tengo suficiente contexto para saber qué la provoca; la compararé con lo que ocurra después.');if(t.includes('intention'))lines.push('No solo guardaré lo que quieres hacer. También observaré si después aparece una acción relacionada y qué ocurre con ella.');if(t.includes('achievement'))lines.push('Lo guardaré como un resultado para poder relacionarlo con las decisiones y situaciones que lo precedieron.');if(t.includes('money'))lines.push('Guardaré el contexto económico para poder recuperarlo cuando aparezcan decisiones relacionadas.');if(t.includes('reminder'))lines.push(r.dt?'Quedó asociado al momento indicado: '+fmt(r.dt)+'.':'Entendí que quieres apoyarte en RADAR para no olvidarlo.');if(t.includes('question'))lines.push('Además de responderte, guardaré el contexto del problema para que la próxima vez no tengas que empezar desde cero.');if(!lines.length)lines.push('Lo guardaré como contexto. Su valor aumentará cuando pueda relacionarlo con lo que ocurra después.');return lines.join('\n\n')}
function render(r){const sig=r.a.map(x=>'<li>'+escape(x.label)+(x.value?' · '+escape(x.value):'')+'</li>').join('');$('result').innerHTML='<div class="card"><h2>📡 Lo que entendí</h2><ul class="signals">'+sig+'</ul><div class="response"><strong>💬 Respuesta de RADAR</strong><p>'+escape(response(r))+'</p><div class="why">🧠 RADAR está construyendo contexto a partir de tu memoria. Las conexiones se harán más útiles a medida que acumule experiencias.</div></div><div class="feedback-title">¿Qué tan útil fue?</div><div class="feedback">'+['Superútil','Bastante útil','Regular','Poco útil','Nada útil'].map(x=>'<button type="button" data-f="'+x+'">'+x+'</button>').join('')+'</div></div>';$('result').querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{if(current){current.feedback=b.dataset.f;save()}}))}
function showMemory(){const ps=patterns(),s=state.slice().reverse();$('secondary').innerHTML='<div class="card"><h2>🧠 Memoria</h2><p class="muted">'+s.length+' momentos guardados en este dispositivo.</p>'+(ps.length?'<h3>Lo que RADAR empieza a aprender</h3>'+ps.map(p=>'<div class="pattern"><strong>'+escape(p.title)+'</strong>'+escape(p.text)+'</div>').join(''):'<p class="muted">Todavía necesito más experiencias para encontrar patrones.</p>')+(s.length?s.map(x=>'<article class="entry"><time>'+escape(new Date(x.at).toLocaleString('es-GT'))+'</time><p>'+escape(x.text)+'</p><small>'+escape((x.analysis||[]).map(a=>a.label).join(' · '))+'</small></article>').join(''):'<p class="muted">Aún no hay nada guardado.</p>')+'</div>'}
function showSummary(){const day=new Date().toDateString(),xs=state.filter(x=>new Date(x.at).toDateString()===day),counts={};xs.forEach(x=>(x.analysis||[]).forEach(a=>counts[a.type]=(counts[a.type]||0)+1));const labels={emotion:'Emociones',concern:'Preocupaciones',intention:'Intenciones',commitment:'Compromisos',reminder:'Recordatorios',money:'Dinero',question:'Preguntas',achievement:'Logros',idea:'Ideas',date:'Fechas',context:'Contexto'};let h='<div class="card"><h2>🌅 Resumen del día</h2><p>Hoy registré <strong>'+xs.length+'</strong> '+(xs.length===1?'momento':'momentos')+'.</p>';if(xs.length)h+='<ul class="summary-list">'+Object.entries(counts).map(([k,v])=>'<li>'+escape(labels[k]||k)+': '+v+'</li>').join('')+'</ul>';const ps=patterns();if(ps.length)h+='<h3>Lo que empieza a aparecer</h3>'+ps.slice(0,3).map(p=>'<div class="pattern"><strong>'+escape(p.title)+'</strong>'+escape(p.text)+'</div>').join('');h+=xs.length?'<h3>Momentos de hoy</h3>'+xs.map(x=>'<p>• '+escape(x.text)+'</p>').join(''):'<p class="muted">Aún no hay entradas de hoy.</p>';h+='</div>';$('secondary').innerHTML=h}
function boot(){state=load();$('detect').addEventListener('click',()=>{try{const text=$('input').value.trim();if(!text)return;const r=analyze(text);current={id:Date.now(),text,at:new Date().toISOString(),analysis:r.a,date:r.dt?r.dt.toISOString():null,reminder:r.explicitReminder,feedback:null};state.push(current);save();render(r);$('input').value='';}catch(e){$('result').innerHTML='<div class="error">RADAR encontró un error al guardar o analizar esta entrada. La memoria anterior no se ha eliminado.</div>';console.error(e)}});$('memoryBtn').addEventListener('click',()=>{try{showMemory()}catch(e){$('secondary').innerHTML='<div class="error">No pude abrir la memoria.</div>';console.error(e)}});$('summaryBtn').addEventListener('click',()=>{try{showSummary()}catch(e){$('secondary').innerHTML='<div class="error">No pude generar el resumen.</div>';console.error(e)}})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=0.10.1').catch(()=>{}));
})();
</script></body></html>
