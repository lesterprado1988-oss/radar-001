<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>RADAR</title><style>body{font-family:system-ui;margin:0;background:#f4f6f8;color:#111827}.wrap{max-width:760px;margin:auto;padding:18px}h1{margin-bottom:4px}.muted{color:#667085}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}textarea,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:10px 13px;margin:5px 4px 5px 0;cursor:pointer}.primary{background:#111827;color:white}.tag{display:inline-block;padding:5px 8px;background:#eef2ff;border-radius:999px;margin:3px;font-size:13px}.signal{border-left:4px solid #111827;padding-left:10px;margin:10px 0}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.danger{background:#fee4e2}.ok{background:#dcfae9}.small{font-size:13px}</style></head><body><div class="wrap"><h1>📡 RADAR</h1><div class="muted">Diario · Memoria · Señales · Acciones</div><div class="card"><textarea id="entry" rows="5" placeholder="Escribe lo que tengas en la cabeza..."></textarea><button class="primary" onclick="analyze()">Detectar señales y guardar</button><button onclick="notifyPermission()">🔔 Activar notificaciones</button></div><div id="result"></div><div class="card"><h2>⏰ Recordatorios</h2><div id="reminders"></div></div><div class="card"><h2>🧠 Memoria</h2><div id="memory"></div></div><div class="card"><h2>💾 Respaldo</h2><p class="small muted">Exporta una copia de tus datos. No dependemos de un servidor para conservarlos.</p><button onclick="backup()">Exportar respaldo</button><button onclick="document.getElementById('restore').click()">Importar respaldo</button><input id="restore" type="file" accept="application/json" style="display:none" onchange="restore(this)"></div></div><script>
const KEY='radar_v05'; let db=JSON.parse(localStorage.getItem(KEY)||'{"entries":[],"reminders":[],"feedback":[]}');
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function analyze(){const text=document.getElementById('entry').value.trim();if(!text)return; const low=text.toLowerCase(); const signals=[]; const add=(type,why)=>signals.push({type,why});
if(/recordarme|recuerdame|jueves|mañana|viernes|lunes|martes|miércoles|miercoles|sábado|sabado|domingo|\b\d{1,2}(:\d{2})?\b/.test(low)) add('⏰ Acción/recordatorio','Parece que estás expresando una acción con un momento futuro.');
if(/compr(ar|e|o)|comprar|gastar|pagar|dinero|precio|costo|cuesta|compra/.test(low)) add('💰 Gasto o decisión de compra','Hay una posible salida de dinero o decisión de compra.');
if(/quiero|debo|necesito|voy a|tengo que|me gustaría/.test(low)) add('🎯 Intención','Aparece una intención que podría convertirse en una acción medible.');
if(/miedo|estres|estrés|preocup|problema|difícil|dificil/.test(low)) add('⚠️ Fricción','Aparece algo que podría estar bloqueando o presionando una decisión.');
if(!signals.length)add('🔎 Señal abierta','RADAR todavía no tiene suficiente evidencia; esta entrada queda en memoria para buscar conexiones futuras.');
const entry={id:crypto.randomUUID(),date:new Date().toISOString(),text,signals};db.entries.unshift(entry); signals.forEach(s=>{if(!db.memory)db.memory={};db.memory[s.type]=(db.memory[s.type]||0)+1});
let reminder=parseReminder(text); if(reminder){db.reminders.push(reminder)}
document.getElementById('entry').value='';save();showResult(entry,reminder)}
function parseReminder(text){const l=text.toLowerCase();if(!/recordarme|recuerdame|recuerdame|tengo que|voy a/.test(l))return null; let date=new Date(); let day=null; const days=['domingo','lunes','martes','miércoles','miercoles','jueves','viernes','sábado','sabado']; days.forEach((d,i)=>{if(l.includes(d))day=i}); if(day!==null){let delta=(day-date.getDay()+7)%7;if(delta===0)delta=7;date.setDate(date.getDate()+delta)}else if(l.includes('mañana'))date.setDate(date.getDate()+1);else date.setDate(date.getDate()+1); const tm=l.match(/(?:a las|las)\s*(\d{1,2})(?::(\d{2}))?/);date.setHours(tm?+tm[1]:9,tm&&tm[2]?+tm[2]:0,0,0);return{id:crypto.randomUUID(),text,when:date.toISOString(),done:false,notified:false}}
function showResult(e,r){let h='<div class="card"><h2>📡 Señales</h2>'+e.signals.map(s=>`<div class="signal"><b>${s.type}</b><div class="small">${s.why}</div><button onclick="fb('${e.id}','🤯')">🤯 No lo había visto</button><button onclick="fb('${e.id}','🙂')">🙂 Ya lo sabía</button><button onclick="fb('${e.id}','❌')">❌ No aplica</button></div>`).join('');if(r)h+=`<div class="ok card"><b>⏰ Recordatorio creado</b><br>${r.text}<br>${new Date(r.when).toLocaleString()}</div>`;h+='</div>';document.getElementById('result').innerHTML=h}
function fb(id,v){db.feedback.push({id,v,date:new Date().toISOString()});save();alert('Feedback guardado: '+v)}
function notifyPermission(){if(!('Notification'in window)){alert('Este navegador no admite notificaciones.');return}Notification.requestPermission().then(p=>alert(p==='granted'?'Notificaciones activadas.':'Permiso no concedido.'))}
function check(){const now=Date.now();db.reminders.forEach(r=>{if(!r.done&&!r.notified&&new Date(r.when).getTime()<=now){if('Notification'in window&&Notification.permission==='granted')new Notification('📡 RADAR',{body:r.text});r.notified=true}});localStorage.setItem(KEY,JSON.stringify(db));render()}
function render(){document.getElementById('reminders').innerHTML=db.reminders.length?db.reminders.map(r=>`<div class="card"><b>${r.done?'✅':'⏰'} ${r.text}</b><br><span class="small">${new Date(r.when).toLocaleString()}</span><br><button onclick="done('${r.id}')">Marcar hecho</button></div>`).join(''):'<span class="muted">Sin recordatorios.</span>';const m=db.memory||{};document.getElementById('memory').innerHTML=Object.keys(m).length?Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="tag">${k}: ${v}</span>`).join(''):'<span class="muted">La memoria se construye con tus entradas.</span>'}
function done(id){const r=db.reminders.find(x=>x.id===id);if(r)r.done=true;save()}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='radar-respaldo-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function restore(input){const f=input.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x.entries||!x.reminders)throw 0;db=x;save();alert('Respaldo restaurado.')}catch(e){alert('El archivo no parece un respaldo válido.')}};rd.readAsText(f)}
render();setInterval(check,30000);check();navigator.serviceWorker?.register('sw.js');
</script></body></html>
