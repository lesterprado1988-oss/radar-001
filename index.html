<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111"><meta name="description" content="RADAR — segundo cerebro personal que recuerda, aprende, conecta y anticipa.">
<title>RADAR — Segundo cerebro personal</title><link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#171717;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.5}main{width:min(700px,100%);margin:auto;padding:24px 18px 42px}header{text-align:center;margin-bottom:24px}h1{font-size:36px;letter-spacing:4px;margin:0}header small{font-size:13px;color:#666}.intro{color:#555;text-align:center;margin:5px auto 24px;max-width:560px}label{display:block;font-size:18px;font-weight:650;margin-bottom:9px}textarea{width:100%;min-height:155px;padding:16px;border:1px solid #c9ccd1;border-radius:15px;background:#fff;font:inherit;resize:vertical;outline:none}textarea:focus{border-color:#555;box-shadow:0 0 0 3px #00000010}#detect{display:block;width:100%;min-height:54px;margin:14px 0 20px;border:0;border-radius:14px;background:#111;color:#fff;font-size:16px;font-weight:750;letter-spacing:.4px;cursor:pointer}.card{background:#fff;border:1px solid #e0e2e5;border-radius:16px;padding:18px;margin-top:14px}.card h2{font-size:19px;margin:0 0 12px}.signals{list-style:none;padding:0;margin:0;display:grid;gap:8px}.signals li{padding:10px 12px;border-radius:10px;background:#f3f4f6}.response{margin-top:18px;border-top:1px solid #eee;padding-top:15px}.response p{white-space:pre-line}.why{margin-top:12px;padding:12px;border-radius:11px;background:#fafafa;color:#555;font-size:14px}.feedback-title{font-weight:700;margin:18px 0 9px}.feedback{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.feedback button,.nav button{min-height:43px;border:1px solid #c9ccd1;background:#fff;border-radius:10px;padding:8px;font:inherit;cursor:pointer}.feedback button:hover,.nav button:hover{background:#f0f1f3}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid #ddd}.nav button{border:0;background:transparent;font-weight:650}.entry{padding:14px 0;border-bottom:1px solid #e2e2e2}.entry:last-child{border-bottom:0}.entry time{font-size:13px;color:#666}.muted{color:#666}.summary-list{margin:8px 0;padding-left:22px}.summary-list li{margin:5px 0}.status{font-size:14px;color:#555;margin-top:8px}.hidden{display:none}.pattern{padding:12px;border-radius:11px;background:#f3f4f6;margin:8px 0}.pattern strong{display:block}.empty{padding:8px 0}@media(max-width:520px){main{padding:20px 14px 34px}h1{font-size:31px}textarea{min-height:140px}.feedback{grid-template-columns:1fr 1fr}.feedback button:last-child{grid-column:1/-1}.nav{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header><h1>RADAR</h1><small>Segundo cerebro personal · Experimento #001 · v0.10</small></header>
<p class="intro">Tú hablas. RADAR recuerda, conecta lo que vas viviendo, aprende de tus respuestas y te ayuda a anticipar.</p>
<label for="input">¿Qué quieres contarme?</label>
<textarea id="input" placeholder="Escribe como hablas normalmente…"></textarea>
<button id="detect">DETECTAR SEÑALES</button>
<section id="result"></section>
<div class="nav"><button id="memoryBtn">📖 Ver memoria</button><button id="summaryBtn">🌅 Resumen del día</button></div>
<section id="secondary"></section>
</main>
<script>
'use strict';
const KEY='radar_memory_v09';
let state=loadMemory(),current=null;
const $=id=>document.getElementById(id);
function loadMemory(){try{const raw=localStorage.getItem(KEY);const d=raw?JSON.parse(raw):[];return Array.isArray(d)?d:[]}catch(e){return []}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
const days=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function nextWeekday(day){const n=new Date(),delta=(day-n.getDay()+7)%7||7,d=new Date(n);d.setDate(n.getDate()+delta);return d}
function parseTime(s,d){let m=s.match(/(?:a las|a la)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm|de la mañana|de la tarde|de la noche)?/i)||s.match(/\b(\d{1,2}):(\d{2})\s*(am|pm)?\b/i);if(!m)return d;let h=+m[1],min=+(m[2]||0),p=(m[3]||'').toLowerCase();if((p==='pm'||p.includes('tarde')||p.includes('noche'))&&h<12)h+=12;if((p==='am'||p.includes('mañana'))&&h===12)h=0;d.setHours(h,min,0,0);return d}
function dateInfo(text){const s=text.toLowerCase(),now=new Date();let d=null;if(/\bhoy\b/.test(s))d=new Date(now);else if(/\bpasado mañana\b/.test(s)){d=new Date(now);d.setDate(d.getDate()+2)}else if(/\bmañana\b/.test(s)){d=new Date(now);d.setDate(d.getDate()+1)}else{const m=s.match(/\b(lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\b/);if(m){const n=days.indexOf(m[1].replace('miercoles','miércoles').replace('sabado','sábado'));d=nextWeekday(n)}}const rel=s.match(/(?:dentro de|en)\s+(\d+)\s*(segundos?|minutos?|horas?)/);if(rel){const n=+rel[1],u=rel[2];return new Date(now.getTime()+(u.startsWith('seg')?n*1000:u.startsWith('min')?n*60000:n*3600000))}return d?parseTime(s,d):null}
function fmt(d){return new Date(d).toLocaleString('es-GT',{dateStyle:'medium',timeStyle:'short'})}
const emotionMap={triste:'tristeza',tristeza:'tristeza',feliz:'alegría',emocionado:'entusiasmo',emocionada:'entusiasmo',preocupado:'preocupación',preocupada:'preocupación',estresado:'estrés',estresada:'estrés',enojado:'enojo',enojada:'enojo',orgulloso:'orgullo',orgullosa:'orgullo',ansioso:'ansiedad',ansiosa:'ansiedad',tranquilo:'tranquilidad',tranquila:'tranquilidad',motivado:'motivación',motivada:'motivación'};
function analyze(text){const s=text.toLowerCase(),a=[];const add=(type,label,value)=>a.push({type,label,value:value||null});
const em=Object.keys(emotionMap).find(k=>new RegExp('\\b'+k+'\\b').test(s));
if(/me siento|estoy (muy )?(triste|feliz|emocionado|emocionada|preocupado|preocupada|estresado|estresada|enojado|enojada|orgulloso|orgullosa|ansioso|ansiosa|tranquilo|tranquila|motivado|motivada)|me da miedo|tengo miedo/.test(s))add('emotion','❤️ Emoción',em?emotionMap[em]:'emoción');
if(/me preocupa|me da miedo|tengo miedo|me estresa|estoy preocupado|estoy preocupada/.test(s))add('concern','🚧 Preocupación');
if(/quiero|quisiera|me gustaría|me gustaria|estoy pensando|estoy considerando|si pudiera|tal vez/.test(s))add('intention','🎯 Intención / deseo');
if(/debo|tengo que|hay que|toca|voy a/.test(s))add('commitment','🎯 Compromiso');
if(/recuérdame|recuerdame|no quiero olvidar|no olvidar|debo recordar|tengo que recordar/.test(s))add('reminder','🔔 Recordatorio');
const money=s.match(/(?:q\s?\.?\s?)(\d+(?:[.,]\d+)?)/i)||s.match(/(\d+(?:[.,]\d+)?)\s?(?:quetzales|quetzal)\b/i);if(/comprar|compra|pagar|pago|gastar|cuesta|presupuesto|dinero|deuda|endeud/.test(s)||money)add('money','💰 Dinero / posible gasto',money?money[1]:null);
if(/cómo puedo|como puedo|cómo hago|como hago|no sé cómo|no se como|qué hago|que hago/.test(s))add('question','❓ Pregunta / ayuda');
if(/ya hice|ya terminé|ya termine|logré|logre|conseguí|consegui|terminé|termine|lo hice/.test(s))add('achievement','🏆 Logro / acción realizada');
if(/idea|se me ocurrió|se me ocurrio|pensé en|pense en/.test(s))add('idea','💡 Idea');
const dt=dateInfo(text);if(dt)add('date','📅 '+fmt(dt),dt.toISOString());
return {a,dt,explicitReminder:a.some(x=>x.type==='reminder')||(a.some(x=>x.type==='commitment')&&!!dt)}}
function recent(n=40){return state.slice(-n)}
function countType(type,value){return state.filter(x=>(x.analysis||[]).some(a=>a.type===type&&(!value||a.value===value))).length}
function emotionHistory(value){return state.filter(x=>(x.analysis||[]).some(a=>a.type==='emotion'&&(!value||a.value===value)))}
function topicHints(){const words=['dinero','deuda','trabajo','negocio','familia','hijos','salud','casa','estudio','tiempo','emprender','comprar'];return words.map(w=>({w,n:state.filter(x=>x.text.toLowerCase().includes(w)).length})).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,4)}
function patterns(){const out=[];const emCounts={};state.forEach(x=>(x.analysis||[]).filter(a=>a.type==='emotion').forEach(a=>emCounts[a.value]=(emCounts[a.value]||0)+1));Object.entries(emCounts).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([e,n])=>out.push({title:'Emoción repetida',text:'Has mencionado '+e+' en '+n+' momentos. RADAR puede empezar a observar qué situaciones suelen aparecer alrededor de esta emoción.'}));topicHints().forEach(x=>out.push({title:'Tema recurrente',text:'Has hablado de “'+x.w+'” '+x.n+' veces. Esto puede convertirse en contexto para futuras sugerencias.'}));const useful=state.filter(x=>x.feedback==='Superútil'||x.feedback==='Bastante útil').length;if(useful)out.push({title:'Aprendizaje de utilidad',text:'Ya hay '+useful+' respuestas que marcaste como útiles. RADAR puede usar esas señales para priorizar el tipo de ayuda que te resulta valiosa.'});return out.slice(0,6)}
function contextualResponse(r){const t=r.a.map(x=>x.type),txt=current.text.toLowerCase(),related=recent(12),priorEmotion=r.a.find(x=>x.type==='emotion')?.value,emN=priorEmotion?emotionHistory(priorEmotion).length:0,topics=topicHints();
let lines=[];
if(t.includes('emotion')){if(emN>=2)lines.push('He notado que esta emoción ya apareció antes en lo que me has contado. No la voy a tratar como un dato aislado; voy a observar qué suele estar pasando alrededor de ella.');else lines.push('Voy a guardar esta emoción como parte de tu contexto. Con más experiencias podré comprobar si se repite y qué suele provocarla.');}
if(t.includes('concern')){if(topics.length)lines.push('También veo temas que se repiten en tu memoria, especialmente '+topics.slice(0,2).map(x=>'“'+x.w+'”').join(' y ')+'. Si esta preocupación vuelve a aparecer relacionada con ellos, RADAR podrá señalarte esa conexión.');else lines.push('No quiero asumir todavía la causa. La guardaré y la compararé con lo que vayas contando después.');}
if(t.includes('intention')){const commits=state.filter(x=>(x.analysis||[]).some(a=>a.type==='commitment')).length;if(commits)lines.push('Ya has registrado otros compromisos. RADAR observará si esta intención se convierte en una acción, para ayudarte a detectar cuándo avanzas o cuándo algo te está frenando.');else lines.push('No solo guardaré el deseo: observaré si después aparece una acción relacionada.');}
if(t.includes('achievement'))lines.push('Esto también importa para tu memoria. RADAR podrá relacionar lo que logras con las decisiones y situaciones que lo precedieron.');
if(t.includes('money')&&t.includes('intention'))lines.push('La combinación de dinero + intención puede ser importante para futuras decisiones. Si vuelves a hablar de esto, RADAR podrá recuperar este contexto antes de sugerirte algo.');
if(t.includes('question'))lines.push('Además de responder la pregunta, RADAR puede conservar el problema detrás de ella para no hacerte empezar desde cero la próxima vez.');
if(t.includes('reminder'))lines.push(r.dt?'También quedó preparado el contexto del recordatorio para '+fmt(r.dt)+'.':'Entendí que no quieres depender de tu memoria para esto; lo guardaré como pendiente.');
if(!lines.length)lines.push('Lo guardaré como contexto. La utilidad de RADAR aumenta cuando puede relacionar esta experiencia con las siguientes.');
return lines.join('\n\n')}
function whyText(r){const p=patterns();if(p.length)return '🧠 Esto se basa en lo que RADAR ya está aprendiendo: '+p[0].text.toLowerCase();return '🧠 Todavía estoy construyendo contexto. Esta entrada servirá para compararla con lo que ocurra después.'}
function render(r){let html='<div class="card"><h2>📡 Lo que entendí</h2><ul class="signals">'+r.a.map(x=>'<li>'+x.label+(x.value?' · '+x.value:'')+'</li>').join('')+'</ul>';if(r.explicitReminder){html+='<p class="status">✓ Recordatorio detectado'+(r.dt?' para <strong>'+fmt(r.dt)+'</strong>':'')+'.</p>';if(r.dt&&r.dt>new Date()){if('Notification'in window&&Notification.permission==='granted')scheduleReminder(current.id,r.dt,current.text);else if('Notification'in window&&Notification.permission==='default')requestNotification()}}html+='<div class="response"><strong>💬 Respuesta de RADAR</strong><p>'+contextualResponse(r)+'</p><div class="why">'+whyText(r)+'</div></div><div class="feedback-title">¿Qué tan útil fue?</div><div class="feedback">'+['Superútil','Bastante útil','Regular','Poco útil','Nada útil'].map(x=>'<button data-feedback="'+x+'">'+x+'</button>').join('')+'</div></div>';$('result').innerHTML=html;$('result').querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>feedback(b.dataset.feedback))}
function requestNotification(){if('Notification'in window)Notification.requestPermission().then(p=>{if(p==='granted'&&current?.date){const d=new Date(current.date);if(d>new Date())scheduleReminder(current.id,d,current.text)}}).catch(()=>{})}
function scheduleReminder(id,date,text){const ms=date-new Date();if(ms<=0||ms>2147483647)return;setTimeout(()=>new Notification('RADAR',{body:text}),ms)}
function feedback(f){if(!current)return;current.feedback=f;save();const p=document.createElement('p');p.className='status';p.textContent='✓ Feedback guardado. RADAR lo usará para aprender qué tipo de ayuda te resulta útil.';$('result').querySelector('.card').appendChild(p)}
$('detect').onclick=()=>{const t=$('input').value.trim();if(!t)return;const r=analyze(t);current={id:Date.now(),text:t,at:new Date().toISOString(),analysis:r.a,date:r.dt?r.dt.toISOString():null,reminder:r.explicitReminder,feedback:null};state.push(current);save();render(r);$('input').value='';if(r.explicitReminder&&'Notification'in window&&Notification.permission==='default')requestNotification()};
$('memoryBtn').onclick=()=>{const s=state.slice().reverse();const ps=patterns();$('secondary').innerHTML='<div class="card"><h2>🧠 Memoria</h2><p class="muted">RADAR conserva lo que cuentas y empieza a convertir repeticiones en contexto.</p>'+ (ps.length?'<h3>Patrones que empiezan a aparecer</h3>'+ps.map(p=>'<div class="pattern"><strong>'+p.title+'</strong>'+escapeHtml(p.text)+'</div>').join(''):'')+(s.length?s.map(x=>'<article class="entry"><time>'+new Date(x.at).toLocaleString('es-GT')+'</time><p>'+escapeHtml(x.text)+'</p><small>'+x.analysis.map(a=>a.label).join(' · ')+(x.feedback?' · Feedback: '+x.feedback:'')+'</small></article>').join(''):'<p class="muted">Aún no hay nada guardado.</p>')+'</div>'};
$('summaryBtn').onclick=()=>{const today=new Date().toDateString(),xs=state.filter(x=>new Date(x.at).toDateString()===today),counts={};xs.flatMap(x=>x.analysis||[]).forEach(a=>counts[a.type]=(counts[a.type]||0)+1);const labels={emotion:'Emociones',concern:'Preocupaciones',intention:'Intenciones',commitment:'Compromisos',reminder:'Recordatorios',money:'Dinero / posibles gastos',question:'Preguntas / ayuda',achievement:'Logros',idea:'Ideas',date:'Fechas'};let h='<div class="card"><h2>🌅 Resumen del día</h2><p>Hoy registré <strong>'+xs.length+'</strong> '+(xs.length===1?'momento':'momentos')+' y los estoy relacionando con tu memoria anterior.</p>';if(xs.length){h+='<ul class="summary-list">'+Object.entries(counts).map(([k,v])=>'<li>'+ (labels[k]||k)+': '+v+'</li>').join('')+'</ul>'}const ps=patterns();if(ps.length)h+='<h3>Lo que empieza a aparecer</h3>'+ps.slice(0,3).map(p=>'<div class="pattern"><strong>'+p.title+'</strong>'+escapeHtml(p.text)+'</div>').join('');h+=xs.length?'<h3>Momentos de hoy</h3>'+xs.map(x=>'<p>• '+escapeHtml(x.text)+'</p>').join(''):'<p class="muted">Aún no hay entradas de hoy.</p>';h+='</div>';$('secondary').innerHTML=h};
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
