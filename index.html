<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>RADAR v0.6</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;background:#f5f5f5;color:#111}.card{background:white;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 2px 12px #0001}textarea{width:100%;min-height:150px;box-sizing:border-box;padding:14px;border:1px solid #ccc;border-radius:12px;font-size:16px}button{padding:12px 16px;border:0;border-radius:10px;cursor:pointer;margin:5px;background:#111;color:white}.feedback button{background:#eee;color:#111}.muted{color:#666}.signal{padding:10px 0;border-bottom:1px solid #eee}.hidden{display:none}.tag{display:inline-block;background:#eee;padding:5px 8px;border-radius:8px;margin:3px;font-size:13px}</style></head><body><div class="card"><h1>RADAR 📡</h1><p class="muted">Tú escribes. RADAR observa.</p><textarea id="entry" placeholder="¿Qué tienes en mente?"></textarea><button id="detect">DETECTAR SEÑALES</button></div><div id="result" class="card hidden"></div><div class="card"><h3>Memoria</h3><div id="memory" class="muted">Aún no hay memoria.</div></div><script>const KEY='radar_v06';const data=JSON.parse(localStorage.getItem(KEY)||'{"entries":[],"memories":[],"reminders":[],"feedback":[]}');const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function signals(t){let x=t.toLowerCase(),s=[];if(/recuérd|recordar|jueves|viernes|lunes|martes|miércoles|miercoles|sábado|sabado|domingo|mañana|mañana/.test(x))s.push(['📅','Intención con fecha','Parece haber algo que quieres hacer en un momento futuro.']);if(/compr|pagar|gastar|dinero|presupuesto|deuda|precio|costo|coste/.test(x))s.push(['💰','Posible impacto económico','Detecté una referencia a dinero, compra o gasto.']);if(/quiero|necesito|debo|voy a|tengo que|me gustaría|me gustaria/.test(x))s.push(['🎯','Intención','Detecté algo que quieres, necesitas o planeas hacer.']);if(/problema|difícil|dificil|miedo|estrés|estres|preocup/.test(x))s.push(['⚠️','Fricción','Detecté una dificultad, preocupación o bloqueo.']);if(/idea|pensé|pense|podría|podria|oportunidad/.test(x))s.push(['💡','Idea / oportunidad','Detecté una posible idea u oportunidad.']);return s}function reminder(t){let x=t.toLowerCase();let days=['domingo','lunes','martes','miércoles','miercoles','jueves','viernes','sábado','sabado'];let d=days.find(z=>x.includes(z));if(!d && !/mañana|manana/.test(x))return null;let msg=t.replace(/recuérdame|recuerdame|recuérdame|recordarme/ig,'').trim();return {text:msg,day:d||'mañana',created:new Date().toISOString()}}function renderMemory(){let counts={};data.memories.forEach(m=>m.tags.forEach(z=>counts[z]=(counts[z]||0)+1));let arr=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);$('memory').innerHTML=arr.length?arr.map(([k,v])=>`<span class="tag">${k}: ${v}</span>`).join(''):'Aún no hay memoria.'}function analyze(){let t=$('entry').value.trim();if(!t)return;let ss=signals(t),r=reminder(t);data.entries.push({text:t,date:new Date().toISOString(),signals:ss.map(s=>s[1])});let tags=ss.map(s=>s[1]);data.memories.push({text:t,date:new Date().toISOString(),tags});if(r)data.reminders.push(r);save();let html='<h2>📡 Detecté '+ss.length+' señal'+(ss.length===1?'':'es')+'</h2>';ss.forEach(s=>html+=`<div class="signal"><b>${s[0]} ${s[1]}</b><br><span class="muted">${s[2]}</span></div>`);if(r)html+=`<p>🔔 <b>Recordatorio guardado:</b> ${r.text} — ${r.day}</p>`;html+='<hr><h3>¿Qué tan útil fue esta detección?</h3><div class="feedback">'+['Superútil','Bastante útil','Regular','Poco útil','Nada útil'].map((v,i)=>`<button onclick="fb('${v}')">${v}</button>`).join('')+'</div>';$('result').innerHTML=html;$('result').classList.remove('hidden');$('entry').value='';renderMemory()}window.fb=v=>{data.feedback.push({value:v,date:new Date().toISOString()});save();$('result').insertAdjacentHTML('beforeend',`<p>✓ Feedback guardado: <b>${v}</b></p>`)};$('detect').onclick=analyze;renderMemory();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
